name: J19 review export
on:
  push:
    branches:
      - ux/j19-review-export-20260909
    paths:
      - '.github/workflows/continuity-review-export.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: j19-review-files
          if-no-files-found: error
          path: |
            prototypes/experience-workbench/journeys/19-insights/**
            prototypes/experience-workbench/registry/journeys.json
            prototypes/experience-workbench/registry/exact-head-gate.json
