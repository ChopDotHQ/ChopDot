name: Continuity review export
on:
  push:
    branches:
      - ux/experience-workbench
    paths:
      - '.github/workflows/continuity-review-export.yml'
      - 'prototypes/experience-workbench/journeys/15-settlement-history/**'
      - 'prototypes/experience-workbench/journeys/16-savings-group/**'
      - 'prototypes/experience-workbench/journeys/17-savings-contribute-withdraw/**'
      - 'prototypes/experience-workbench/journeys/18-activity-notifications/**'
      - 'prototypes/experience-workbench/registry/continuity-review-candidates.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: continuity-review-files
          if-no-files-found: error
          path: |
            prototypes/experience-workbench/journeys/15-settlement-history/**
            prototypes/experience-workbench/journeys/16-savings-group/**
            prototypes/experience-workbench/journeys/17-savings-contribute-withdraw/**
            prototypes/experience-workbench/journeys/18-activity-notifications/**
            prototypes/experience-workbench/registry/continuity-review-candidates.json
