name: Temporary repository-enforcement repin

on:
  pull_request:
    paths:
      - '.github/workflows/repin-repository-enforcement-temp.yml'

permissions:
  contents: read

jobs:
  repin:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/polkadot-sep26-compat'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout exact bounded branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Repin only repository-enforcement and self-delete
        run: |
          set -euo pipefail
          test "$GITHUB_HEAD_REF" = "agent/polkadot-sep26-compat"
          python - <<'PY'
          import copy, json
          from pathlib import Path

          path = Path('governance/agent-system/steering-surface-registry.v1.json')
          before = json.loads(path.read_text())
          after = copy.deepcopy(before)
          groups = [g for g in after['surface_groups'] if g.get('id') == 'repository-enforcement']
          if len(groups) != 1:
              raise SystemExit(f'expected exactly one repository-enforcement group, found {len(groups)}')
          group = groups[0]
          old = 'ea1588ceb4d8cdd4d8980443bd2a35304b5244cea055ecbb508516081511ddbd'
          new = 'c9b481fb76634de2136c5fd682c19892ec8293a2ba88dd617c732c6f95351eab'
          if group.get('trusted_manifest_sha256') != old:
              raise SystemExit(f'unexpected prior manifest: {group.get("trusted_manifest_sha256")}')
          group['trusted_manifest_sha256'] = new

          normalized = copy.deepcopy(after)
          target = [g for g in normalized['surface_groups'] if g.get('id') == 'repository-enforcement'][0]
          target['trusted_manifest_sha256'] = old
          if normalized != before:
              raise SystemExit('refusing: registry change exceeds the single trusted manifest field')
          path.write_text(json.dumps(after, indent=2) + '\n')
          PY
          rm -- .github/workflows/repin-repository-enforcement-temp.yml
          changed="$(git status --porcelain --untracked-files=all | sed 's/^...//' | sort)"
          expected="$(printf '%s\n%s\n' '.github/workflows/repin-repository-enforcement-temp.yml' 'governance/agent-system/steering-surface-registry.v1.json' | sort)"
          test "$changed" = "$expected"
          git add -- governance/agent-system/steering-surface-registry.v1.json .github/workflows/repin-repository-enforcement-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(governance): repin enforcement after SDK refresh"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
