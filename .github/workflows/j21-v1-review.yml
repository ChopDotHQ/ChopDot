name: Journey 21 V1 candidate QA

permissions:
  contents: read

on:
  push:
    branches:
      - ux/experience-workbench-j21-v1-candidate
    paths:
      - '.github/workflows/j21-v1-review.yml'
      - 'prototypes/experience-workbench/journeys/21-wallet-crypto/v1-candidate.html'
      - 'prototypes/experience-workbench/journeys/21-wallet-crypto/source/review-qa-v1.mjs'
      - 'prototypes/experience-workbench/journeys/21-wallet-crypto/source/network-rejection-origin-qa.mjs'
  workflow_dispatch:

jobs:
  j21-v1-candidate-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run exact-head J21 browser, interaction, layout and semantic QA
        run: node prototypes/experience-workbench/journeys/21-wallet-crypto/source/review-qa-v1.mjs
      - name: Run rejected-network origin regression
        run: node prototypes/experience-workbench/journeys/21-wallet-crypto/source/network-rejection-origin-qa.mjs
      - name: Upload exact-head J21 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j21-v1-candidate-review-${{ github.sha }}
          path: artifacts/j21-v1-review
          if-no-files-found: error
          retention-days: 14
