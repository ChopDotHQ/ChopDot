name: Install AI SDK on experiment branch

on:
  push:
    branches:
      - experiment/ai-gateway-smoke
    paths:
      - .github/workflows/ai-gateway-install.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    if: github.ref_name == 'experiment/ai-gateway-smoke'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install AI SDK with npm
        run: npm install ai

      - name: Commit dependency changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "chore: install Vercel AI SDK"
          git push
