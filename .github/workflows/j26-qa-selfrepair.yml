name: J26 QA self-repair
on:
  push:
    branches:
      - ux/experience-workbench-j26-v1-candidate
    paths:
      - .github/workflows/j26-qa-selfrepair.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ux/experience-workbench-j26-v1-candidate
      - name: Patch guarded direct deletion assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('prototypes/experience-workbench/journeys/26-group-lifecycle/source/review-qa-v1.mjs')
          s=p.read_text()
          old="  await goto(p, 'deleted');\n  await visibleContains(`${vp.name} deletion scope`, p, ['This working state', 'Group removed', 'Exports / backups', 'Not claimed erased', 'Provider / chain history', 'Not claimed erased']);"
          new="  await goto(p, 'deleted', 'owner', { members: '1', open: '0' });\n  await visibleContains(`${vp.name} deletion scope`, p, ['This working state', 'Group removed', 'Exports / backups', 'Not claimed erased', 'Provider / chain history', 'Not claimed erased']);"
          if s.count(old) != 1:
              raise SystemExit(f'expected one deletion-scope assertion, found {s.count(old)}')
          p.write_text(s.replace(old,new))
          PY
          git diff --check
      - name: Commit QA self-repair
        run: |
          git config user.name "ChatGPT Factory Builder"
          git config user.email "actions@users.noreply.github.com"
          git add prototypes/experience-workbench/journeys/26-group-lifecycle/source/review-qa-v1.mjs
          git rm -f .github/workflows/j26-qa-selfrepair.yml
          git commit -m "Fix J26 guarded deletion QA setup"
          git push origin HEAD:ux/experience-workbench-j26-v1-candidate
