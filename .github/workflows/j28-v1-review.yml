name: Journey 28 V1 Exact Candidate QA

on:
  workflow_dispatch:
  push:
    branches:
      - ux/experience-workbench-j28-v1-candidate
    paths:
      - prototypes/experience-workbench/journeys/28-failure-recovery/v1-candidate.html
      - prototypes/experience-workbench/journeys/28-failure-recovery/spec.md
      - prototypes/experience-workbench/journeys/28-failure-recovery/STATE_INVENTORY.md
      - prototypes/experience-workbench/journeys/28-failure-recovery/EDGE_CASES.md
      - prototypes/experience-workbench/journeys/28-failure-recovery/source/**
      - .github/workflows/j28-v1-review.yml

permissions:
  contents: read

jobs:
  j28-v1-review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run Journey 28 exact-head browser QA
        run: node prototypes/experience-workbench/journeys/28-failure-recovery/source/review-qa-v1.mjs
      - name: Upload Journey 28 exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j28-v1-review-evidence-${{ github.sha }}
          path: artifacts/j28-v1-review
          if-no-files-found: error
          retention-days: 14
