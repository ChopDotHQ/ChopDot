name: Product Schema V1

on:
  push:
    branches: [research/product-schema-v1]
    paths:
      - 'product-schema/**'
      - 'prototypes/experience-workbench/**'
      - '.github/workflows/product-schema-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema:
    name: Verify hardened product schema
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch accepted Gate A evidence branch
        run: git fetch origin review/golden-faithful-v2-gate-a --depth=1
      - run: node product-schema/verify-stage-1.mjs
      - run: node product-schema/verify-stage-2.mjs
      - run: node product-schema/verify-stage-3.mjs
      - run: node product-schema/verify-schema-hardening.mjs
      - run: node product-schema/mutation-battery.mjs
      - run: node product-schema/derive-stage-4.mjs
      - run: node product-schema/verify-stage-4.mjs
      - run: node product-schema/derive-ux-diagnostics.mjs
      - run: node product-schema/verify-ux-diagnostics.mjs
      - run: node product-schema/derive-task-metrics.mjs
      - run: node product-schema/verify-task-metrics.mjs
      - run: node product-schema/derive-stage-5.mjs
      - run: node product-schema/verify-reconstruction-closure.mjs
      - run: node product-schema/verify-mechanical-mutations.mjs
      - name: Upload generated schema diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: product-schema-generated
          path: product-schema/generated
          if-no-files-found: error
          retention-days: 7
      - name: Verify generated outputs are pinned
        run: |
          git diff --exit-code -- product-schema/generated
          test -z "$(git ls-files --others --exclude-standard product-schema/generated)"
