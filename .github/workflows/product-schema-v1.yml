name: Product Schema V1

on:
  push:
    branches: [research/product-schema-v1]
    paths:
      - 'product-schema/**'
      - 'prototypes/experience-workbench/**'
      - '.github/workflows/product-schema-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage-1:
    name: Verify frozen product inventory
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Stage 1 inventory
        run: node product-schema/verify-stage-1.mjs
