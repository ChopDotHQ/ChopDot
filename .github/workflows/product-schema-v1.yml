name: Product Schema V1

on:
  push:
    branches: [research/product-schema-v1]
    paths:
      - 'product-schema/**'
      - 'prototypes/experience-workbench/**'
      - '.github/workflows/product-schema-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema:
    name: Verify complete product schema and Gate B derivation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Stage 1 inventory
        run: node product-schema/verify-stage-1.mjs
      - name: Verify Stage 2 semantic normalization
        run: node product-schema/verify-stage-2.mjs
      - name: Verify Stage 3 composition wiring
        run: node product-schema/verify-stage-3.mjs
      - name: Regenerate Stage 4 views
        run: node product-schema/derive-stage-4.mjs
      - name: Verify Stage 4 completeness and Gate B packet
        run: node product-schema/verify-stage-4.mjs
      - name: Ensure generated views are committed exactly
        run: git diff --exit-code -- product-schema/generated
