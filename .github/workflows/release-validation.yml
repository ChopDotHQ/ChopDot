name: Release Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: Release capability preflight
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.capability.outputs.ready }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect release runtime
        id: capability
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f scripts/run-smoke-suite.cjs ]] && node -e "const p=require('./package.json'); process.exit(p.scripts?.['ci:release'] && (p.devDependencies?.['@playwright/test'] || p.devDependencies?.playwright) ? 0 : 1)"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "## Release validation capability: READY" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Release validation capability: BLOCKED"
              echo "The canonical source does not yet contain the complete browser-smoke and release runtime. No release-readiness claim is made."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  blocked:
    name: Release validation — blocked (runtime absent)
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.ready != 'true'
    steps:
      - name: Record blocked capability
        run: |
          echo "Release validation was not executed because the required runtime is absent."
          echo "This successful job records an explicit blocker; it is not release evidence."

  full-release-suite:
    name: Full Release Suite
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL || 'https://example.supabase.co' }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY || 'test-anon-key' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run release suite
        run: npm run ci:release
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-validation-${{ github.run_id }}
          path: |
            artifacts/SMOKE_*.md
            artifacts/AUDIT_COMPONENTS_STRUCTURE.*
            output/playwright/**
          if-no-files-found: ignore
          retention-days: 14
