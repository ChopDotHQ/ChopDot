name: Edge Functions Sync

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: Edge-function capability preflight
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.capability.outputs.ready }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect edge-function verifier
        id: capability
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f scripts/verify-edge-functions.sh ]] && node -e "const p=require('./package.json'); process.exit(p.scripts?.['verify:edge-functions'] ? 0 : 1)"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "## Edge-function verification: READY" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Edge-function verification: BLOCKED"
              echo "The verifier removed from the current mvp source has not yet been reconciled. No edge-function sync proof is claimed."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  blocked:
    name: Edge functions — blocked (verifier absent)
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.ready != 'true'
    steps:
      - name: Record blocked capability
        run: |
          echo "Edge functions were not verified because the canonical source has no verifier."
          echo "This successful job records an explicit blocker; it is not edge-function evidence."

  verify-edge-functions:
    name: Verify Edge Functions
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install dependencies
        run: npm ci
      - name: Verify edge functions
        run: npm run verify:edge-functions
