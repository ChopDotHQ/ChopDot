name: DATA-002 Bootstrap

on:
  push:
    branches:
      - agent/data-002-integer-money
    paths:
      - '.github/workflows/data-002-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-002-bootstrap
  cancel-in-progress: false

jobs:
  recover-verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chopdot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chopdot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATA002_BASE_SHA: 9fbef7d603e53d8246119dd82d941719e2595ed9
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/chopdot
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/chopdot
      VITE_DATA_SOURCE: local
      VITE_SUPABASE_URL: https://example.invalid
      VITE_SUPABASE_ANON_KEY: test-only

    steps:
      - name: Checkout staged transport
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Recover prepared source archive
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/recover-data002.py <<'PY'
          from pathlib import Path
          import base64, hashlib, json, re, shutil, tarfile, zipfile

          root = Path.cwd()
          transport = root / '.data-002-transport'
          manifest_path = transport / 'manifest.json'
          if not manifest_path.exists():
              raise SystemExit('DATA-002 transport manifest is missing')
          manifest = json.loads(manifest_path.read_text())

          def natural(path: Path):
              return [int(piece) if piece.isdigit() else piece for piece in re.split(r'(\d+)', str(path.relative_to(transport)))]

          chunks = sorted(
              [path for path in transport.rglob('*') if path.is_file() and path.name != 'manifest.json'],
              key=natural,
          )
          if not chunks:
              raise SystemExit('DATA-002 transport contains no chunks')

          texts = []
          for path in chunks:
              try:
                  texts.append(path.read_text())
              except UnicodeDecodeError:
                  texts.append('')

          candidates = []
          seen = set()
          def add(name, payload):
              if not payload:
                  return
              digest = hashlib.sha256(payload).hexdigest()
              if digest not in seen:
                  seen.add(digest)
                  candidates.append((name, payload))

          raw = b''.join(path.read_bytes() for path in chunks)
          joined = ''.join(texts).encode()
          compact = re.sub(rb'\s+', b'', joined)
          add('raw', raw)
          add('joined', joined)
          add('compact', compact)
          for name, payload in [('joined', joined), ('compact', compact)]:
              try:
                  add(name + '-base64', base64.b64decode(payload, validate=False))
              except Exception:
                  pass
              try:
                  padded = payload + b'=' * ((4 - len(payload) % 4) % 4)
                  add(name + '-urlsafe', base64.urlsafe_b64decode(padded))
              except Exception:
                  pass
              try:
                  add(name + '-hex', bytes.fromhex(payload.decode()))
              except Exception:
                  pass
          try:
              add('per-chunk-base64', b''.join(base64.b64decode(re.sub(r'\s+', '', text)) for text in texts))
          except Exception:
              pass

          declared = []
          def walk(value):
              if isinstance(value, dict):
                  for key, item in value.items():
                      yield key, item
                      yield from walk(item)
              elif isinstance(value, list):
                  for item in value:
                      yield from walk(item)
          for key, value in walk(manifest):
              if isinstance(value, str) and any(token in key.lower() for token in ('chunk', 'path', 'file')):
                  candidate = transport / value
                  if candidate.is_file() and candidate not in declared:
                      declared.append(candidate)
          if declared:
              declared_raw = b''.join(path.read_bytes() for path in declared)
              declared_text = ''.join(path.read_text() for path in declared).encode()
              add('declared-raw', declared_raw)
              add('declared-text', declared_text)
              try:
                  add('declared-base64', base64.b64decode(re.sub(rb'\s+', b'', declared_text), validate=False))
              except Exception:
                  pass

          output = Path('/tmp/data002-payload')
          shutil.rmtree(output, ignore_errors=True)
          output.mkdir(parents=True)
          selected = None
          for name, payload in candidates:
              candidate = Path('/tmp') / f'data002-{name}.archive'
              candidate.write_bytes(payload)
              try:
                  if zipfile.is_zipfile(candidate):
                      with zipfile.ZipFile(candidate) as archive:
                          archive.extractall(output)
                      selected = name
                      break
              except Exception:
                  pass
              try:
                  if tarfile.is_tarfile(candidate):
                      with tarfile.open(candidate, 'r:*') as archive:
                          archive.extractall(output, filter='data')
                      selected = name
                      break
              except Exception:
                  pass
          if selected is None:
              raise SystemExit('Could not decode the DATA-002 source archive')

          children = list(output.iterdir())
          if len(children) == 1 and children[0].is_dir() and not (output / 'package.json').exists():
              top = children[0]
              flattened = Path('/tmp/data002-payload-flat')
              shutil.rmtree(flattened, ignore_errors=True)
              flattened.mkdir()
              for child in top.iterdir():
                  shutil.move(str(child), flattened / child.name)
              shutil.rmtree(output)
              flattened.rename(output)

          required = [
              output / 'package.json',
              output / 'backend' / 'package.json',
              output / 'src',
              output / 'backend' / 'prisma' / 'schema.prisma',
          ]
          missing = [str(path) for path in required if not path.exists()]
          if missing:
              raise SystemExit('Recovered source is incomplete: ' + ', '.join(missing))
          print(json.dumps({'decoder': selected, 'files': sum(1 for path in output.rglob('*') if path.is_file())}))
          PY
          python /tmp/recover-data002.py

      - name: Create clean implementation tree
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$DATA002_BASE_SHA"
          git clean -fdx
          rsync -a --delete --exclude='.git' /tmp/data002-payload/ ./
          rm -rf .data-002-transport .github/workflows/data-002-bootstrap.yml
          test ! -e .data-002-transport
          test -f package.json
          test -f backend/package.json
          git status --short

      - name: Verify DATA-002 source contract
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const walk = (dir) => fs.readdirSync(dir, {withFileTypes: true}).flatMap((entry) => {
            const full = path.join(dir, entry.name);
            return entry.isDirectory() ? walk(full) : [full];
          });
          const files = walk('.').filter((file) => !file.includes(`${path.sep}.git${path.sep}`));
          const textFiles = files.filter((file) => /\.(ts|tsx|js|mjs|json|sql|md|prisma)$/.test(file));
          const corpus = textFiles.map((file) => fs.readFileSync(file, 'utf8')).join('\n');
          const assertions = [
            ['integer money units', /amountUnits|units:\s*string|MoneyUnits|minorUnits/],
            ['currency scale', /currencyScale|scale:\s*number|CurrencyScale/],
            ['schema version', /schemaVersion/],
            ['ordered migration', /migration|migratePersisted/i],
            ['split conservation', /conserv|remainder|allocate/i],
            ['database integer column', /amount_units|amountUnits/],
          ];
          for (const [label, pattern] of assertions) {
            if (!pattern.test(corpus)) throw new Error(`Missing DATA-002 contract: ${label}`);
          }
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (!packageJson.scripts?.['test:data-002']) throw new Error('Missing test:data-002 script');
          if (!packageJson.scripts?.['verify:provider-neutral']) throw new Error('Missing verify:provider-neutral script');
          NODE
          npm run verify:reconciliation
          npm run verify:provider-neutral

      - name: Install frontend dependencies
        run: npm ci

      - name: Exact money and persistence tests
        run: npm run test:data-002

      - name: Frontend checks
        run: npm run ci:fast

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Backend checks
        run: npm --prefix backend run ci:fast

      - name: Apply PostgreSQL migrations
        run: npm --prefix backend run db:migrate

      - name: Verify PostgreSQL integer-money schema
        shell: bash
        run: |
          set -euo pipefail
          if npm --prefix backend run | grep -q 'verify:data-002-db'; then
            npm --prefix backend run verify:data-002-db
          else
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            integer_columns integer;
          BEGIN
            SELECT count(*) INTO integer_columns
            FROM information_schema.columns
            WHERE table_schema = 'public'
              AND column_name IN ('amount_units', 'amountUnits')
              AND data_type IN ('bigint', 'numeric', 'text');
            IF integer_columns = 0 THEN
              RAISE EXCEPTION 'No canonical integer-money database columns found';
            END IF;
          END $$;
          SQL
          fi

      - name: Publish one clean implementation commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Recovered payload produced no DATA-002 changes' >&2
            exit 1
          fi
          if git diff --cached --name-only | grep -q '^\.data-002-transport/'; then
            echo 'Transport files would leak into the implementation commit' >&2
            exit 1
          fi
          git commit -m 'feat: canonical integer money and versioned persistence'
          git push --force origin HEAD:refs/heads/agent/data-002-integer-money
