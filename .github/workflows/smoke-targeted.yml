name: Smoke (Targeted)

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: Smoke capability preflight
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.capability.outputs.ready }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect smoke runtime
        id: capability
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -f scripts/ci-smoke-targeted.cjs ]] || missing+=("scripts/ci-smoke-targeted.cjs")
          node -e "const p=require('./package.json'); process.exit(p.scripts?.['ci:smoke:targeted'] && (p.devDependencies?.['@playwright/test'] || p.devDependencies?.playwright) ? 0 : 1)" || missing+=("Playwright package/smoke script")

          if (( ${#missing[@]} == 0 )); then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "## Targeted smoke capability: READY" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Targeted smoke capability: BLOCKED"
              echo "The canonical source does not currently contain the legacy smoke runtime. No browser-smoke proof is claimed."
              echo ""
              printf -- '- Missing: `%s`\n' "${missing[@]}"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  blocked:
    name: Targeted smoke — blocked (runtime absent)
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.ready != 'true'
    steps:
      - name: Record blocked capability
        run: |
          echo "Targeted smoke was not executed because its required runtime is absent."
          echo "This successful job records an explicit blocker; it is not browser test evidence."

  detect:
    name: Detect Smoke Scope
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    outputs:
      core_changed: ${{ steps.filter.outputs.core }}
      guest_changed: ${{ steps.filter.outputs.guest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Path filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            core:
              - 'src/components/AppRouter.tsx'
              - 'src/components/screens/**'
              - 'src/hooks/**'
              - 'src/nav.ts'
              - 'src/services/**'
              - 'src/types/**'
            guest:
              - 'src/components/AppRouter.tsx'
              - 'src/components/auth/**'
              - 'src/components/screens/AddMember.tsx'
              - 'src/components/screens/AuthScreen.tsx'
              - 'src/components/screens/MembersTab.tsx'
              - 'src/nav.ts'
              - 'src/services/**'

  smoke-core:
    name: Targeted Smoke (Core)
    runs-on: ubuntu-latest
    needs: [preflight, detect]
    if: needs.preflight.outputs.ready == 'true' && needs.detect.outputs.core_changed == 'true'
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL || 'https://example.supabase.co' }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY || 'test-anon-key' }}
      SMOKE_SUITE: core
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run targeted smoke suite
        run: npm run ci:smoke:targeted
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-core-evidence-${{ github.run_id }}
          path: |
            artifacts/SMOKE_*.md
            output/playwright/**
          if-no-files-found: ignore
          retention-days: 14

  smoke-guest:
    name: Targeted Smoke (Guest)
    runs-on: ubuntu-latest
    needs: [preflight, detect]
    if: needs.preflight.outputs.ready == 'true' && needs.detect.outputs.guest_changed == 'true'
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL || 'https://example.supabase.co' }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY || 'test-anon-key' }}
      SMOKE_SUITE: guest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run guest smoke suite
        run: npm run ci:smoke:targeted
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-guest-evidence-${{ github.run_id }}
          path: |
            artifacts/SMOKE_*.md
            output/playwright/**
          if-no-files-found: ignore
          retention-days: 14
