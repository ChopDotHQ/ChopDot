name: Polkadot Products Devnet Assurance

on:
  pull_request:
    paths:
      - '.github/workflows/polkadot-sep26-assurance.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'src/environment/**'
      - 'tests/polkadot-host-sim.spec.ts'
      - 'playwright.host-sim.config.ts'
      - 'deployment/recovery-head-index-targets.json'
      - 'deployment/recovery-head-index/devnet.json'
      - 'contracts/recovery-head-index/artifacts/**'
      - 'scripts/capture-dotns-code-anchors.mjs'
      - 'scripts/recovery-head-deployment.mjs'
      - 'scripts/lib/release-evidence.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: polkadot-products-devnet-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  evidence-wiring-repair:
    name: Evidence snapshot wiring repair
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: true
      - name: Assert exact candidate checkout and bounded branch
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$GITHUB_HEAD_REF" = "agent/polkadot-sep26-compat"
      - name: Replace hard-coded dated evidence paths
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/lib/release-evidence.mjs')
          source = p.read_text()
          old = """export async function loadDeploymentContext(root, environment) {
            const [targetsRecord, padRecord, anchorsRecord] = await Promise.all([
              readJson(path.join(root, 'deployment/recovery-head-index-targets.json')),
              readJson(path.join(root, 'deployment/pad-environments-2026-08-23.json')),
              readJson(path.join(root, 'deployment/dotns-code-anchors-2026-08-23.json')),
            ]);
          """.replace('          ', '')
          new = """export async function loadDeploymentContext(root, environment) {
            const targetsRecord = await readJson(path.join(root, 'deployment/recovery-head-index-targets.json'));
            const resolveEvidencePath = (candidate, fallback, label) => {
              const relative = candidate ?? fallback;
              if (typeof relative !== 'string' || path.isAbsolute(relative) || !relative.startsWith('deployment/') || relative.includes('..')) {
                throw new Error(`${label} must be a repository-relative deployment JSON path.`);
              }
              return path.join(root, relative);
            };
            const anchorsRecord = await readJson(resolveEvidencePath(
              targetsRecord.value.dotnsCodeAnchors,
              'deployment/dotns-code-anchors-2026-08-23.json',
              'DotNS code anchor path',
            ));
            const padRecord = await readJson(resolveEvidencePath(
              anchorsRecord.value.sourceEnvironmentFile,
              'deployment/pad-environments-2026-08-23.json',
              'Environment snapshot path',
            ));
          """.replace('          ', '')
          if source.count(old) != 1:
              raise SystemExit(f'expected one hard-coded loader block, found {source.count(old)}')
          p.write_text(source.replace(old, new))
          PY
          test "$(git diff --name-only)" = "scripts/lib/release-evidence.mjs"
          grep -q "targetsRecord.value.dotnsCodeAnchors" scripts/lib/release-evidence.mjs
          grep -q "anchorsRecord.value.sourceEnvironmentFile" scripts/lib/release-evidence.mjs
      - name: Commit only the evidence loader repair
        run: |
          git add -- scripts/lib/release-evidence.mjs
          test "$(git diff --cached --name-only)" = "scripts/lib/release-evidence.mjs"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(devnet): follow declared evidence snapshots"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

  host-simulator:
    name: Products Devnet host simulator
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - name: Assert exact candidate checkout
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install exact lockfile dependencies
        run: npm ci
      - name: Install exact Playwright Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Exercise Products Devnet host integration
        run: npm run test:host-sim
      - name: Assert repository remained clean
        run: |
          git diff --exit-code
          git diff --cached --exit-code

  recovery-readback:
    name: Products Devnet RecoveryHeadIndex readback
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - name: Assert exact candidate checkout
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install exact lockfile dependencies
        run: npm ci
      - name: Observe current Products Devnet DOTNS code anchors
        run: >-
          node scripts/capture-dotns-code-anchors.mjs
          --environment=devnet
          --source-environment-file=deployment/pad-environments-2026-09-10.json
      - name: Read back existing Products Devnet contract and deployment receipt
        run: >-
          node scripts/recovery-head-deployment.mjs
          --environment=devnet
          --readback
          --address=0x391DBCF8267f6AeCd4BE5DD84039dF588EC337EC
          --transaction-hash=0x2d49753699012b494a0b71979ee0a0ec1e5acb95bc78b2c2ba8722424b93eade
          --block-number=12603206
          --block-hash=0x4ad0b1745ae3d4f09fc8dee7b940bdde7c5483e95c86b159ee0d1ddfc77d87b2
