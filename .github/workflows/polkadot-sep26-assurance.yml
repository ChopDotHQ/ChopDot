name: Polkadot Products Devnet Assurance

on:
  pull_request:
    paths:
      - '.github/workflows/polkadot-sep26-assurance.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'src/environment/**'
      - 'tests/polkadot-host-sim.spec.ts'
      - 'playwright.host-sim.config.ts'
      - 'deployment/recovery-head-index-targets.json'
      - 'deployment/recovery-head-index/devnet.json'
      - 'contracts/recovery-head-index/artifacts/**'
      - 'scripts/capture-dotns-code-anchors.mjs'
      - 'scripts/recovery-head-deployment.mjs'
      - 'scripts/lib/release-evidence.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: polkadot-products-devnet-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  lockfile-candidate:
    name: SDK lockfile candidate
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: true
      - name: Assert exact candidate checkout and bounded branch
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$GITHUB_HEAD_REF" = "agent/polkadot-sep26-compat"
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Resolve package-lock from package.json without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify exact dependency resolution and bounded diff
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const root = lock.packages?.[''];
          if (root?.dependencies?.['@parity/product-sdk-host'] !== '0.16.0') throw new Error('host root pin mismatch');
          if (root?.dependencies?.['@parity/product-sdk-statement-store'] !== '0.6.5') throw new Error('statement-store root pin mismatch');
          if (root?.devDependencies?.['@parity/host-api-test-sdk'] !== '^0.12.1') throw new Error('host-test root pin mismatch');
          if (root?.devDependencies?.['@polkadot-community-foundation/polkadot-app-deploy'] !== '0.13.1') throw new Error('deploy tool pin changed');
          if (lock.packages?.['node_modules/@parity/product-sdk-host']?.version !== '0.16.0') throw new Error('host resolution mismatch');
          if (lock.packages?.['node_modules/@parity/product-sdk-statement-store']?.version !== '0.6.5') throw new Error('statement-store resolution mismatch');
          if (lock.packages?.['node_modules/@parity/host-api-test-sdk']?.version !== '0.12.1') throw new Error('host-test resolution mismatch');
          NODE
          test -z "$(git status --porcelain --untracked-files=all | grep -v '^ M package-lock.json$')"
          test -n "$(git status --porcelain --untracked-files=all | grep '^ M package-lock.json$')"
      - name: Commit generated lockfile only
        run: |
          git add -- package-lock.json
          test "$(git diff --cached --name-only)" = "package-lock.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(polkadot): refresh SDK lockfile"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
      - name: Upload generated lockfile candidate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: polkadot-sdk-lockfile-${{ github.run_id }}
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7

  host-simulator:
    name: Products Devnet host simulator
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - name: Assert exact candidate checkout
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install exact lockfile dependencies
        run: npm ci
      - name: Install exact Playwright Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Exercise Products Devnet host integration
        run: npm run test:host-sim
      - name: Assert repository remained clean
        run: |
          git diff --exit-code
          git diff --cached --exit-code

  recovery-readback:
    name: Products Devnet RecoveryHeadIndex readback
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - name: Assert exact candidate checkout
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install exact lockfile dependencies
        run: npm ci
      - name: Observe current Products Devnet DOTNS code anchors
        run: >-
          node scripts/capture-dotns-code-anchors.mjs
          --environment=devnet
          --source-environment-file=deployment/pad-environments-2026-09-10.json
      - name: Read back existing Products Devnet contract and deployment receipt
        run: >-
          node scripts/recovery-head-deployment.mjs
          --environment=devnet
          --readback
          --address=0x391DBCF8267f6AeCd4BE5DD84039dF588EC337EC
          --transaction-hash=0x2d49753699012b494a0b71979ee0a0ec1e5acb95bc78b2c2ba8722424b93eade
          --block-number=12603206
          --block-hash=0x4ad0b1745ae3d4f09fc8dee7b940bdde7c5483e95c86b159ee0d1ddfc77d87b2
