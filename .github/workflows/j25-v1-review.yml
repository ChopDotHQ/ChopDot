name: Journey 25 V1 candidate QA

permissions:
  contents: read

on:
  push:
    branches:
      - ux/experience-workbench-j25-v1-candidate
    paths:
      - '.github/workflows/j25-v1-review.yml'
      - 'prototypes/experience-workbench/journeys/25-storage-recovery/v1-candidate.html'
      - 'prototypes/experience-workbench/journeys/25-storage-recovery/source/review-qa-v1.mjs'
      - 'prototypes/experience-workbench/journeys/25-storage-recovery/source/current-work-packet.md'
      - 'prototypes/experience-workbench/journeys/25-storage-recovery/spec.md'
      - 'prototypes/experience-workbench/journeys/25-storage-recovery/STATE_INVENTORY.md'
      - 'prototypes/experience-workbench/journeys/25-storage-recovery/EDGE_CASES.md'
      - 'prototypes/experience-workbench/journeys/25-storage-recovery/source/decision-history.md'
  workflow_dispatch:

jobs:
  j25-v1-candidate-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run exact-head J25 browser, layout, trust and caller-reachability QA
        run: node prototypes/experience-workbench/journeys/25-storage-recovery/source/review-qa-v1.mjs
      - name: Upload exact-head J25 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j25-v1-candidate-review-${{ github.sha }}
          path: artifacts/j25-v1-review
          if-no-files-found: error
          retention-days: 14
