name: Integrated Product Preview

on:
  push:
    branches:
      - 'research/integrated-preview-*'
    paths:
      - 'prototypes/integrated-product-preview/**'
      - '.github/workflows/integrated-preview.yml'
  pull_request:
    paths:
      - 'prototypes/integrated-product-preview/**'
      - '.github/workflows/integrated-preview.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate integrated preview
        run: node prototypes/integrated-product-preview/validate.mjs

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --include=optional
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start static preview server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/chopdot-preview-server.log 2>&1 &
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/prototypes/integrated-product-preview/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/chopdot-preview-server.log
          exit 1
      - name: Run J01-J28 browser continuity QA
        run: node prototypes/integrated-product-preview/browser-qa.mjs
      - name: Upload preview QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-product-preview-${{ github.sha }}
          path: prototypes/integrated-product-preview/artifacts/
          if-no-files-found: warn
