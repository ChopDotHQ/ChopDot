name: Prototype workbench gate

permissions:
  contents: write

on:
  push:
    branches:
      - ux/experience-workbench
    paths:
      - 'prototypes/experience-workbench/**'
      - '.github/workflows/prototype-workbench-gate.yml'
  pull_request:
    paths:
      - 'prototypes/experience-workbench/**'

jobs:
  validate-workbench:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototypes/experience-workbench
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply contract update, materialize prototypes, and validate
        run: npm run gate
      - name: Commit generated workbench files on prototype branch
        if: github.event_name == 'push'
        working-directory: .
        run: |
          if git diff --quiet -- prototypes/experience-workbench; then
            echo "Generated workbench files are current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prototypes/experience-workbench
          git commit -m "Materialize and validate Journey 11 contract"
          git push
      - name: Fail pull request when generated files are stale
        if: github.event_name == 'pull_request'
        working-directory: .
        run: git diff --exit-code -- prototypes/experience-workbench
