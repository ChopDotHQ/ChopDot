name: J26 bounded reviewer repair
on:
  push:
    branches:
      - ux/experience-workbench-j26-v1-candidate
    paths:
      - .github/workflows/j26-bounded-reviewer-repair.yml
permissions:
  contents: write
jobs:
  apply-repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ux/experience-workbench-j26-v1-candidate
      - name: Apply exact reviewer repair
        run: python3 prototypes/experience-workbench/journeys/26-group-lifecycle/source/apply-review-repair.py
      - name: Check patch shape
        run: |
          git diff --check
          git diff -- prototypes/experience-workbench/journeys/26-group-lifecycle/v1-candidate.html prototypes/experience-workbench/journeys/26-group-lifecycle/source/review-qa-v1.mjs
      - name: Commit repaired candidate
        run: |
          git config user.name "ChatGPT Factory Builder"
          git config user.email "actions@users.noreply.github.com"
          git add prototypes/experience-workbench/journeys/26-group-lifecycle/v1-candidate.html prototypes/experience-workbench/journeys/26-group-lifecycle/source/review-qa-v1.mjs
          git rm .github/workflows/j26-bounded-reviewer-repair.yml prototypes/experience-workbench/journeys/26-group-lifecycle/source/apply-review-repair.py
          git commit -m "Repair J26 durable lifecycle truth"
          git push origin HEAD:ux/experience-workbench-j26-v1-candidate
# trigger bounded repair
