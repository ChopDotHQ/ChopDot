name: Journey 23 V1 candidate QA

permissions:
  contents: read

on:
  push:
    branches:
      - ux/experience-workbench-j23-v1-candidate
    paths:
      - '.github/workflows/j23-v1-review.yml'
      - 'prototypes/experience-workbench/journeys/23-import/v1-candidate.html'
      - 'prototypes/experience-workbench/journeys/23-import/source/review-qa-v1.mjs'
      - 'prototypes/experience-workbench/journeys/23-import/spec.md'
      - 'prototypes/experience-workbench/journeys/23-import/STATE_INVENTORY.md'
      - 'prototypes/experience-workbench/journeys/23-import/EDGE_CASES.md'
      - 'prototypes/experience-workbench/journeys/23-import/source/decision-history.md'
  workflow_dispatch:

jobs:
  j23-v1-candidate-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run exact-head J23 browser, interaction, layout and authority QA
        run: node prototypes/experience-workbench/journeys/23-import/source/review-qa-v1.mjs
      - name: Upload exact-head J23 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j23-v1-candidate-review-${{ github.sha }}
          path: artifacts/j23-v1-review
          if-no-files-found: error
          retention-days: 14
