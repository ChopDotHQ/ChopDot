name: Product IR V0

on:
  push:
    branches:
      - research/product-ir-v0-expense-slice
    paths:
      - 'research/product-ir-v0/**'
      - '.github/workflows/product-ir-v0.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  invariant-probes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run standalone invariant probe
        run: node research/product-ir-v0/invariant-probe.mjs
      - name: Run model-driven invariant probe
        run: node research/product-ir-v0/model-driven-probe.mjs
      - name: Run mutation and blast-radius probe
        run: node research/product-ir-v0/mutation-probe.mjs
      - name: Run decomposition and recomposition probe
        run: node research/product-ir-v0/composition-probe.mjs
      - name: Exercise Product IR query surface
        run: |
          node research/product-ir-v0/query.mjs decompose ExpenseAccounting
          node research/product-ir-v0/query.mjs why-untrusted Position SPLIT-003
          node research/product-ir-v0/query.mjs impact Expense.funding FUND-001,FUND-002,FUND-003
      - name: Derive semantic change plan
        run: node research/product-ir-v0/change-plan.mjs Funding
      - name: Discover candidate implementation ownership
        run: node research/product-ir-v0/implementation-discovery.mjs
      - name: Generate agent change packet
        run: node research/product-ir-v0/agent-change-packet.mjs
