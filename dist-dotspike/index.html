<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ChopDot · chopdot.dot</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0b12;
        --fg: #f4f4f8;
        --muted: #9aa0b4;
        --accent: #e6007a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: radial-gradient(120% 120% at 50% 0%, #15101f 0%, var(--bg) 60%);
        color: var(--fg);
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        padding: 24px;
      }
      main { max-width: 30rem; text-align: center; }
      .badge {
        display: inline-block;
        font-size: 0.75rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--accent);
        border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
        border-radius: 999px;
        padding: 4px 12px;
        margin-bottom: 20px;
      }
      h1 { font-size: 2.25rem; margin: 0 0 8px; }
      .dot { color: var(--accent); }
      p { color: var(--muted); margin: 0 0 12px; }
      code { color: var(--fg); background: #1b1b29; padding: 2px 6px; border-radius: 6px; }
    </style>
  </head>
  <body>
    <main>
      <span class="badge">Native on Polkadot</span>
      <h1>ChopDot<span class="dot">.dot</span></h1>
      <p>Group money, settled together. This name resolves on-chain via DotNS and is served from the Polkadot Bulletin Chain.</p>
      <p>Deploy spike — pipeline verification. <code>chopdot.dot</code></p>
    </main>
  </body>
</html>
