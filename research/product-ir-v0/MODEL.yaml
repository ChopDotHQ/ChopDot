version: product-ir-v0
status: experimental_non_authoritative
scope: expense_split_position

sources:
  authority_commit: 9128bb55d8aed29b5c31fb6d769af39f2651cb76
  journeys:
    J05: prototypes/experience-workbench/journeys/05-add-expense/spec.md
    J06: prototypes/experience-workbench/journeys/06-review-correct-expense/spec.md
    J08: prototypes/experience-workbench/journeys/08-group-home/spec.md
    J10: prototypes/experience-workbench/journeys/10-overall-position/spec.md

types:
  Money:
    fields:
      currency: Currency
      minor_units: Integer
    invariants:
      - id: MONEY-001
        rule: minor_units >= 0
      - id: MONEY-002
        rule: arithmetic_never_silently_combines_different_currencies

  Participant:
    fields:
      id: ParticipantId

  Group:
    fields:
      id: GroupId
      currency: Currency
      participants: ParticipantId[]

  Contribution:
    purpose: records_who_funded_the_expense
    fields:
      participant: ParticipantId
      amount: Money
    invariants:
      - id: FUND-001
        rule: sum(contribution.amount.minor_units) == expense.amount.minor_units
      - id: FUND-002
        rule: all_contribution_currencies_equal_expense_currency
      - id: FUND-003
        rule: every_contributor_belongs_to_group
      - id: FUND-004
        rule: contributor_uniqueness_policy_must_be_explicit
        qualification: current_product_is_single_payer_so_multi_payer_uniqueness_is_not_yet_approved_product_law

  Allocation:
    purpose: records_who_consumed_or_owes_the_expense
    fields:
      participant: ParticipantId
      amount: Money

  Split:
    fields:
      method: [equal, exact, shares]
      participants: ParticipantId[]
      allocations: Allocation[]
    invariants:
      - id: SPLIT-001
        rule: allocation_participants_are_selected_participants
      - id: SPLIT-002
        rule: all_allocation_currencies_equal_expense_currency
      - id: SPLIT-003
        rule: sum(allocation.amount.minor_units) == expense.amount.minor_units
      - id: SPLIT-004
        rule: equal_split_remainder_policy_must_be_deterministic
        qualification: policy_not_encoded_in_v0_until_existing_authority_is_identified

  Expense:
    fields:
      id: ExpenseId
      group: GroupId
      amount: Money
      description: NonEmptyString
      payer: ParticipantId
      funding: Contribution[]
      split: Split
      date: Date
      receipt: OptionalReceipt
      status: [draft, saved, deleted]
    semantics:
      funding: who_paid
      split: who_owes_or_consumed
      participant_delta: funded_amount_minus_beneficiary_allocation
    invariants:
      - id: EXP-001
        rule: payer_belongs_to_group
      - id: EXP-002
        rule: split_participants_are_subset_of_group_participants
      - id: EXP-003
        rule: saved_expense_has_valid_amount_description_and_split

  Position:
    kind: derived_read_model
    derived_from:
      - saved_expenses
      - valid_settlement_effects
      - issue_readiness
    invariants:
      - id: POS-001
        rule: different_currencies_never_combine_silently
      - id: POS-002
        rule: person_netting_only_same_two_people_and_same_currency
      - id: POS-003
        rule: source_group_lineage_remains_explainable
      - id: POS-004
        rule: unresolved_issue_only_marks_dependent_balance_may_change

operations:
  Expense.Create:
    inputs: [group, amount, description]
    defaults:
      payer: viewer_participant
      participants: all_group_participants
      split_method: equal
      date: today
      receipt: none
    transitions:
      - from: absent
        event: begin
        to: draft
      - from: draft
        event: save_valid
        to: saved
        requires: [EXP-001, EXP-002, EXP-003, SPLIT-001, SPLIT-002, SPLIT-003]
        effects: [Position.Recompute]
      - from: draft
        event: save_failed
        to: draft
        guarantees: [entered_details_preserved]
    recovery:
      possible_duplicate: warn_without_trapping
      offline: local_save_allowed_by_J05_contract
      failure: preserve_entered_details

  Expense.Edit:
    from: saved
    authorization: expense_owner_or_authorized_role
    reuse_controls_from: Expense.Create
    effects:
      - update_expense
      - update_or_reset_review_status_transparently
      - Position.Recompute

  Expense.Delete:
    from: saved
    authorization: expense_owner_or_authorized_role
    requires: explicit_confirmation
    to: deleted
    effects: [Position.Recompute]

  Position.Recompute:
    kind: pure_derivation_target
    formula: per_participant_delta = funded_amount - beneficiary_allocation
    requires: [FUND-001, FUND-002, SPLIT-002, SPLIT-003, POS-001, POS-002, POS-003, POS-004]
    conservation:
      rule: sum(per_participant_delta) == 0_per_expense_currency

projections:
  J05:
    uses: [Expense.Create, Expense, Split]
    purpose: create_shared_expense
  J06:
    uses: [Expense, Expense.Edit, Expense.Delete, Split]
    purpose: understand_and_correct_existing_expense
  J08:
    uses: [Expense, Position]
    purpose: group_overview_and_contextual_handoffs
  J10:
    uses: [Position]
    purpose: understand_people_group_and_currency_positions
  J11:
    uses: [Position]
    relation: downstream_consumer
    purpose: settlement_consumes_derived_obligations
  J18:
    uses: [Expense]
    relation: downstream_projection
    purpose: activity_and_history_representation
  J24:
    uses: [Expense, Split]
    relation: downstream_projection
    purpose: portable_export_preserves_financial_semantics
  J28:
    uses: [Expense.Create, Expense.Edit]
    relation: recovery_governor
    purpose: uncertain_result_idempotency_and_reconciliation

experiment_change:
  id: MULTI_PAYER
  from:
    Expense.payer: ParticipantId
  to:
    Expense.payers: Contribution[]
  expected_impact:
    invariants:
      - EXP-001
      - FUND-001
      - FUND-002
      - FUND-003
      - SPLIT-003
      - POS-002
      - POS-003
    operations:
      - Expense.Create
      - Expense.Edit
      - Position.Recompute
    projections:
      - J05
      - J06
      - J08
      - J10
      - J11
      - J18
      - J24
      - J28
    migration:
      rule: existing_single_payer_becomes_one_contribution_for_full_expense_amount
    questions:
      - Does payer contribution conservation require a new invariant?
      - How do payer contributions interact with beneficiary allocations?
      - Does J10 gross exposure remain derivable without ambiguity?
      - Which downstream Activity/Export/Settlement projections become affected outside V0?


executable_rules:
  - id: FUND-001
    subject: Funding
    kind: sum_equals
    collection: funding
    value_path: amount.minor_units
    equals_path: amount.minor_units
  - id: FUND-002
    subject: Funding
    kind: all_equal_path
    collection: funding
    value_path: amount.currency
    equals_path: amount.currency
  - id: FUND-003
    subject: Funding
    kind: all_members_in
    collection: funding
    member_path: participant
    set_path: group_participants
  - id: SPLIT-002
    subject: Split
    kind: all_equal_path
    collection: allocations
    value_path: amount.currency
    equals_path: amount.currency
  - id: SPLIT-003
    subject: Split
    kind: sum_equals
    collection: allocations
    value_path: amount.minor_units
    equals_path: amount.minor_units
  - id: POSITION-CONSERVATION
    subject: Position
    kind: participant_delta_zero_sum
    funding_collection: funding
    allocation_collection: allocations
    participant_path: participant
    value_path: amount.minor_units


impact_rules:
  FUND-001:
    invalidates: [Expense, Position]
    affects_operations: [Expense.Create, Expense.Edit, Position.Recompute]
    affects_projections: [J05, J06, J08, J10, J11, J18, J24, J28]
  FUND-002:
    invalidates: [Expense, Position]
    affects_operations: [Expense.Create, Expense.Edit, Position.Recompute]
    affects_projections: [J05, J06, J08, J10, J11, J18, J24]
  FUND-003:
    invalidates: [Expense]
    affects_operations: [Expense.Create, Expense.Edit]
    affects_projections: [J05, J06, J18, J24]
  SPLIT-002:
    invalidates: [Split, Position]
    affects_operations: [Expense.Create, Expense.Edit, Position.Recompute]
    affects_projections: [J05, J06, J08, J10, J11, J18, J24]
  SPLIT-003:
    invalidates: [Split, Position]
    affects_operations: [Expense.Create, Expense.Edit, Position.Recompute]
    affects_projections: [J05, J06, J08, J10, J11, J18, J24]
  POSITION-CONSERVATION:
    invalidates: [Position]
    affects_operations: [Position.Recompute]
    affects_projections: [J08, J10, J11]


composition_contracts:
  ExpenseAccounting:
    inputs: [Expense.amount, Expense.funding, Expense.split, Group.participants]
    requires: [FUND-001, FUND-002, FUND-003, SPLIT-002, SPLIT-003]
    derives:
      participant_delta:
        formula: funded_amount - beneficiary_allocation
        unit: minor_units_per_currency
      position_conservation:
        formula: sum(participant_delta)
        equals: 0
    outputs: [Position]
    consumers: [J08, J10, J11]
    observers: [J18, J24]
    recovery_governor: J28

queries:
  decompose:
    ExpenseAccounting:
      returns: [inputs, requires, derives, outputs, consumers, observers, recovery_governor]
  why_untrusted:
    Position:
      trace_via: [composition_contracts.ExpenseAccounting, executable_rules, impact_rules]
  impact:
    Expense.funding:
      trace_via: [composition_contracts.ExpenseAccounting, impact_rules]


semantic_dependencies:
  - from: Expense
    uses: [Funding, Split]
  - from: Expense.Create
    uses: [Expense, Funding, Split]
  - from: Expense.Edit
    uses: [Expense, Funding, Split]
  - from: Position.Recompute
    uses: [ExpenseAccounting]
  - from: Position
    uses: [Position.Recompute]
  - from: J05
    uses: [Expense.Create]
  - from: J06
    uses: [Expense.Edit, Expense.Delete]
  - from: J08
    uses: [Position]
  - from: J10
    uses: [Position]
  - from: J11
    uses: [Position]
  - from: J18
    uses: [Expense]
  - from: J24
    uses: [Expense, Split]
  - from: J28
    uses: [Expense.Create, Expense.Edit]
